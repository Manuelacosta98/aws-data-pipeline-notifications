[project]
name = "aws-data-pipeline-notifications"
version = "0.1.0"
description = "Event-driven notification system for AWS data pipeline monitoring and alerting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Manuel Acosta" }]
keywords = [
    "aws",
    "cdk",
    "data-pipeline",
    "notifications",
    "eventbridge",
    "sns",
    "chatbot",
    "slack",
    "monitoring",
    "serverless",
]
dependencies = [
    "aws-cdk-lib>=2.206.0,<3.0.0",
    "constructs>=10.0.0,<11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # boto3 is provided by the AWS Lambda runtime at execution time, so it is
    # not declared as a runtime dependency. We add it as a dev dependency so
    # unit tests can import the handler module locally.
    "boto3>=1.34.0",
]

[tool.uv]
# This is an application (CDK app), not a publishable library.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
